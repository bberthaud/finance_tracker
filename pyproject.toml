[project]
name = "finance-tracker"
version = "1.0.0"
description = "Suivi budgétaire : banque (Woob) → Notion → Streamlit"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.45.1",
    "plotly==5.19.0",
    "polars==0.20.5",
    "python-dotenv==1.0.1",
    "notion-client==2.2.1",
    "google-auth==2.28.1",
    "google-api-python-client==2.118.0",
    "google-auth-httplib2==0.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.2",
    "ruff==0.6.9",
]
sync = [
    "woob==3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "ui: tests de l'interface Streamlit (AppTest)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "bank", "drive", "notion", "processing"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "others", "exports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035"]
